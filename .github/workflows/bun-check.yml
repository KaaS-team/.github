name: bun-check

# Reusable gate for a Bun repo: install, then `make check`. Call it with
#   uses: KaaS-team/.github/.github/workflows/bun-check.yml@v1
on:
  workflow_call:
    inputs:
      runner:
        description: Public repos use ubuntu-latest, private repos ubicloud-standard-2.
        type: string
        default: ubuntu-latest
      bun-version:
        type: string
        default: "1.3"
      timeout-minutes:
        description: A pull request gets at most 3 minutes of CI.
        type: number
        default: 3

jobs:
  push:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - run: make install
      - run: make check

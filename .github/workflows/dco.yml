name: dco

# Every commit in a pull request carries a Signed-off-by line matching its author.
#   uses: KaaS-team/.github/.github/workflows/dco.yml@v1
on:
  workflow_call:

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$sha")
            if ! git log -1 --format=%B "$sha" | grep -qiF "Signed-off-by: " || \
               ! git log -1 --format=%B "$sha" | grep -qiF "<$email>"; then
              echo "::error::$sha is not signed off by $email (git commit -s)"
              bad=1
            fi
          done
          exit $bad
